<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Alicorn documentation has moved</title>
    <script>
      // Preserve deep links: /Alicorn/components/radio-group/ and
      // /Alicorn/docs/guides/component-authoring/ keep their sub-path on the
      // consolidated site, which is served from /alicorn-website/.
      (function () {
        var target = 'https://carnival-science.github.io/alicorn-website/';
        var path = window.location.pathname.replace(/^\/alicorn(?:\/|$)/i, '');
        window.location.replace(target + path + window.location.search + window.location.hash);
      })();
    </script>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f1eee5;
        color: #252b2e;
        font: 1rem/1.6 "Segoe UI", system-ui, sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { margin: 0 0 0.5rem; font-size: 1.6rem; letter-spacing: -0.03em; }
      a { color: #22627f; }
    </style>
  </head>
  <body>
    <main>
      <h1>The Alicorn documentation site moved.</h1>
      <p>
        This page moved to the consolidated Alicorn documentation site.
        <a href="https://carnival-science.github.io/alicorn-website/">Continue to the documentation</a>.
      </p>
    </main>
  </body>
</html>
