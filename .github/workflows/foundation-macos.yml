name: Alicorn foundation (macOS)

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install supported Odin SDK
        shell: bash
        run: |
          odin_root="$RUNNER_TEMP/alicorn-odin"
          sh tools/setup_macos_odin.sh "$odin_root"
          echo "$odin_root" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$odin_root" >> "$GITHUB_ENV"
          echo "ALICORN_ODIN=$odin_root/odin" >> "$GITHUB_ENV"

      - name: Install hash-verified wgpu-native for the pinned Odin bindings
        shell: bash
        run: sh tools/setup_macos_wgpu_native.sh "$ODIN_ROOT"

      - name: Build checksum-pinned SDL3 for native host checks
        shell: bash
        run: |
          brew install cmake pkgconf sdl3
          sdl_prefix="$RUNNER_TEMP/alicorn-sdl3"
          sh tools/setup_macos_sdl3.sh "$sdl_prefix"
          echo "ALICORN_SDL3_PREFIX=$sdl_prefix/prefix" >> "$GITHUB_ENV"
          echo "ALICORN_EXTRA_LINKER_FLAGS=-L$sdl_prefix/prefix/lib -Wl,-rpath,$sdl_prefix/prefix/lib" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$sdl_prefix/prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Install wasm-ld for Odin js_wasm32 linking
        shell: bash
        run: |
          brew install lld llvm
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
          wasm-ld --version

      - name: Report Odin installation
        shell: sh
        run: |
          echo "Odin path: $(command -v odin)"
          odin version

      - name: Build and run foundation checks
        shell: sh
        run: ./tools/check.sh

      - name: Build and run headless native text-input contract
        shell: sh
        run: ./tools/test.sh

      - name: Validate source-over blending through Metal readback
        shell: sh
        run: sh tools/validate_blending.sh

      - name: Build WebGPU feasibility fixture and smoke Metal readback plus surface resize
        shell: sh
        run: |
          sh examples/15_webgpu_feasibility/build.sh
          ./examples/15_webgpu_feasibility/out/webgpu_feasibility_smoke
          ./examples/15_webgpu_feasibility/out/webgpu_feasibility_resize_smoke

      - name: Validate patched wgpu-native device-destroy callbacks through Metal
        shell: sh
        run: sh tools/validate_wgpu_native_device_loss_macos.sh

      - name: Validate bounded retained-effects experiment through Metal readback
        shell: bash
        run: |
          set -o pipefail
          sh tools/validate_effects.sh | tee out/retained-effects-metal.txt

      - name: Upload retained-effects Metal evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-effects-metal
          path: |
            out/retained-effects/**
            out/retained-effects-metal.txt
          retention-days: 7

      - name: Smoke-test example runners
        shell: sh
        run: |
          ./tools/run_example.sh 01_hello --idle-validation-seconds=2
          ./tools/run_example.sh 03_async_list --smoke

      - name: Run secondary-window waker teardown under ThreadSanitizer
        shell: bash
        run: |
          REPO_ROOT=$PWD
          . tools/common.sh
          ODIN=$(alicorn_resolve_odin)
          ACCESSKIT_LINK_FLAGS=$(alicorn_accesskit_linker_flags)
          alicorn_odin_with_linker_flags "$ODIN" "$ACCESSKIT_LINK_FLAGS" \
            test native/sdl_gpu "-collection:alicorn=$REPO_ROOT" \
            -define:ODIN_TEST_NAMES=test_secondary_window_wakers_remain_live_until_application_stop \
            -sanitize:thread

      - name: Build and run retained-work benchmark
        shell: sh
        run: ./tools/bench.sh
      - name: Measure flat material and bounded relief geometry
        shell: bash
        run: ./tools/bench_material.sh
