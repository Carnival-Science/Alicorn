name: Redirect the retired website URL

# The website moved out of this repository to the private
# Carnival-Science/alicorn-website repository, published at
# https://carnival-science.github.io/alicorn-website/.
#
# This workflow keeps the former project Pages URL alive as a redirect so
# existing links that point at https://carnival-science.github.io/Alicorn/ still
# reach the consolidated site.

on:
  push:
    branches: [master]
    paths:
      - 'redirect/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: redirect
      - id: deployment
        uses: actions/deploy-pages@v4
