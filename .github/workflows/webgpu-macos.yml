name: WebGPU feasibility (macOS arm64)

on:
  workflow_dispatch:
  push:
    branches:
      - codex/webgpu-phase0-feasibility
    paths:
      - 'examples/15_webgpu_feasibility/**'
      - 'renderer/webgpu/**'
      - 'host/sdl3/**'
      - 'host/presentation/**'
      - 'tools/common.sh'
      - 'tools/accesskit.sh'
      - 'tools/setup_macos_odin.sh'
      - 'tools/setup_macos_wgpu_native.sh'
      - 'tools/setup_macos_sdl3.sh'
      - 'dependencies/odin-accesskit.json'
      - 'dependencies/webgpu-toolchain.md'
      - '.github/workflows/webgpu-macos.yml'

jobs:
  macos-arm64-metal:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache pinned Odin SDK and wgpu-native
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/alicorn-odin
          key: alicorn-odin-macos-arm64-dev-2026-11-wgpu-v29.0.1.1

      - name: Cache AccessKit C release
        uses: actions/cache@v4
        with:
          path: .deps/accesskit
          key: accesskit-c-0.23.1-macOS-arm64

      - name: Install pinned Odin SDK
        shell: bash
        run: |
          odin_root="$RUNNER_TEMP/alicorn-odin"
          if [ ! -x "$odin_root/odin" ]; then
            rm -rf "$odin_root"
            sh tools/setup_macos_odin.sh "$odin_root"
          fi
          echo "$odin_root" >> "$GITHUB_PATH"
          echo "ODIN_ROOT=$odin_root" >> "$GITHUB_ENV"
          echo "ALICORN_ODIN=$odin_root/odin" >> "$GITHUB_ENV"
          "$odin_root/odin" version

      - name: Install hash-verified wgpu-native for the pinned Odin bindings
        shell: bash
        run: sh tools/setup_macos_wgpu_native.sh "$ODIN_ROOT"

      - name: Build checksum-pinned SDL3 for the native fixture
        shell: bash
        run: |
          brew install cmake pkgconf
          sdl_prefix="$RUNNER_TEMP/alicorn-sdl3"
          sh tools/setup_macos_sdl3.sh "$sdl_prefix"
          echo "ALICORN_SDL3_PREFIX=$sdl_prefix/prefix" >> "$GITHUB_ENV"
          echo "DYLD_LIBRARY_PATH=$sdl_prefix/prefix/lib${DYLD_LIBRARY_PATH:+:$DYLD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build the native fixture with shared wgpu-native
        shell: sh
        run: sh examples/15_webgpu_feasibility/build.sh --native-only

      - name: Run Metal readback and surface-resize smoke
        shell: bash
        run: |
          set -o pipefail
          readback_log="$RUNNER_TEMP/webgpu-macos-readback.txt"
          ./examples/15_webgpu_feasibility/out/webgpu_feasibility_smoke 2>&1 | tee "$readback_log"
          grep -Fq 'adapter info backend=Metal' "$readback_log"
          grep -Fq 'async RGBA8 readback core PASS' "$readback_log"
          grep -Fq 'async RGBA8 readback compositor PASS' "$readback_log"
          grep -Fq 'async RGBA8 readback effects PASS' "$readback_log"
          grep -Fq 'rounded accessibility-material readback PASS' "$readback_log"
          resize_log="$RUNNER_TEMP/webgpu-macos-resize.txt"
          ./examples/15_webgpu_feasibility/out/webgpu_feasibility_resize_smoke 2>&1 | tee "$resize_log"
          grep -Fq 'SurfacePresent submitted at 800x450' "$resize_log"
          grep -Fq 'SurfacePresent submitted at 720x405' "$resize_log"

      - name: Summarize adapter and retention counters
        if: always()
        shell: bash
        run: |
          {
            echo "## macOS arm64 Metal fixture"
            echo
            echo '```'
            grep -E 'adapter info|async RGBA8 readback (core|compositor|effects)|rounded accessibility-material|retirement PASS|cache PASS|queue work done' \
              "$RUNNER_TEMP/webgpu-macos-readback.txt" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload macOS logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webgpu-macos-arm64-metal
          path: |
            ${{ runner.temp }}/webgpu-macos-readback.txt
            ${{ runner.temp }}/webgpu-macos-resize.txt
          if-no-files-found: warn
          retention-days: 7
