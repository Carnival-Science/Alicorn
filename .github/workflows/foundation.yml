name: Alicorn foundation

on:
  push:
  pull_request:

jobs:
  headless:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release: dev-2026-11
      - name: Cache AccessKit C release
        uses: actions/cache@v4
        with:
          path: .deps/accesskit
          key: accesskit-c-0.23.1-${{ runner.os }}-${{ runner.arch }}
      - name: Build and run foundation tests
        shell: pwsh
        run: ./tools/test.ps1 -Odin odin
      - name: Prove SDL_GPU consumers build without wgpu-native
        shell: pwsh
        run: ./tools/test_sdl_gpu_without_wgpu_native.ps1 -Odin odin
      - name: Validate source-over blending through Direct3D 12 readback
        shell: pwsh
        run: ./tools/validate_blending.ps1 -Odin odin
      - name: Validate bounded retained-effects experiment through Direct3D 12 readback
        shell: pwsh
        run: |
          ./tools/validate_effects.ps1 -Odin odin | Tee-Object -FilePath out/retained-effects-d3d12.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate dense retained point markers through Direct3D 12 readback
        shell: pwsh
        run: |
          ./tools/validate_point_markers.ps1 -Odin odin -Driver direct3d12 | Tee-Object -FilePath out/point-markers-d3d12.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload point-marker Direct3D 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: point-markers-d3d12
          path: out/point-markers-d3d12.txt
          retention-days: 7

      - name: Validate host-owned presenter swapchain failure recovery through Direct3D 12
        shell: pwsh
        run: |
          ./tools/native_sdl_gpu.ps1 -Odin odin -PresentationValidation | Tee-Object -FilePath out/presentation-validation-d3d12.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload presenter Direct3D 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presenter-d3d12
          path: out/presentation-validation-d3d12.txt
          retention-days: 7

      - name: Upload retained-effects Direct3D 12 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retained-effects-d3d12
          path: |
            out/retained-effects/**
            out/retained-effects-d3d12.txt
          retention-days: 7
      - name: Compile every example
        shell: pwsh
        run: ./tools/build_examples.ps1 -Odin odin
      - name: Build shared native and browser fixture; smoke-test D3D12 readback
        shell: pwsh
        run: |
          ./examples/15_webgpu_feasibility/build.ps1 -Odin odin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & ./examples/15_webgpu_feasibility/out/webgpu_feasibility_smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Smoke-test example runners
        shell: pwsh
        run: |
          ./tools/run_example.ps1 -Example 01_hello -AppArgs @('--idle-validation-seconds=2')
          ./tools/run_example.ps1 -Example 03_async_list -AppArgs @('--smoke')
      - name: Build and run retained-work benchmark
        shell: pwsh
        run: ./tools/bench.ps1 -Odin odin
      - name: Measure flat material and bounded relief geometry
        shell: pwsh
        run: ./tools/bench_material.ps1 -Odin odin
